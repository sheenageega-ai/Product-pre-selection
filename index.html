<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saree Collection Selection Portal</title>
</head>
<body style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; color: #0f172a; margin: 0;">

    <div style="max-width: 1200px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05); border: 1px solid #f1f5f9;">
        <div style="border-bottom: 1px solid #f1f5f9; padding-bottom: 15px; margin-bottom: 25px;">
            <h1 style="font-size: 24px; font-weight: 700; color: #0f172a; margin: 0;">Saree Collection Selection Portal</h1>
            <p style="font-size: 14px; color: #64748b; margin: 5px 0 0 0;">Review the pre-selected saree items below and tick checkboxes to compile your committee response.</p>
        </div>
        
        <!-- Target grid layout where items will load with true interactive checkboxes -->
        <div id="product-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px;">
            <div style="grid-column: 1 / -1; text-align: center; padding: 48px 0;">
                <p style="color: #94a3b8; font-weight: 500;">Synchronizing with Saree Masterfile Feed...</p>
            </div>
        </div>

        <!-- Submission Trigger Hub -->
        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #e2e8f0;">
            <button onclick="sendSelection()" style="width: 100%; display: flex; align-items: center; justify-content: center; background-color: #059669; color: #ffffff; font-weight: 600; padding: 14px 16px; border-radius: 12px; border: none; cursor: pointer; font-size: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); transition: background-color 0.2s;">
                Send Final Selection via WhatsApp
            </button>
        </div>
    </div>

    <script>
        let globalProducts = [];

        async function loadSheetDataDirectly() {
            const csvUrl = 'https://google.com' + new Date().getTime();
            
            try {
                const response = await fetch(csvUrl);
                if (!response.ok) throw new Error("Connection failed");
                const textData = await response.text();
                
                const lines = textData.split(/\r?\n/);
                const headerIndex = 7; 
                if (lines.length <= headerIndex) {
                    showErrorState("The Google Sheet database layout contains missing values.");
                    return;
                }

                const headers = parseCSVLine(lines[headerIndex]);
                const rows = [];

                for (let i = headerIndex + 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    const values = parseCSVLine(lines[i]);
                    const rowData = {};
                    headers.forEach((header, index) => {
                        rowData[header.trim()] = values[index] ? values[index].trim() : '';
                    });
                    rows.push(rowData);
                }

                renderCatalog(rows);

            } catch (error) {
                showErrorState("Network connection block or uninitialized CSV file stream pipeline.");
            }
        }

        function parseCSVLine(text) {
            let p = '', c = [];
            let q = false;
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                if (char === '"') { q = !q; }
                else if (char === ',' && !q) { c.push(p); p = ''; }
                else { p += char; }
            }
            c.push(p);
            return c;
        }

        function formatDriveImageUrl(rawUrl) {
            if (!rawUrl) return "";
            const cleanUrl = rawUrl.trim();
            
            const driveKeyIndex = cleanUrl.indexOf("com1");
            if (driveKeyIndex !== -1) {
                const fileId = cleanUrl.substring(driveKeyIndex + 4).trim();
                return "https://googleusercontent.com" + fileId;
            }
            
            if (cleanUrl.includes('://google.com')) {
                let fileId = "";
                if (cleanUrl.includes('/d/')) {
                    const parts = cleanUrl.split('/d/');
                    if (parts && parts) fileId = parts.split('/').split('?');
                }
                if (fileId) return "https://googleusercontent.com" + fileId;
            }
            return cleanUrl;
        }
        function renderCatalog(rows) {
            const container = document.getElementById('product-container');
            container.innerHTML = '';
            globalProducts = [];

            // Filters database matrix to ONLY match rows where Status equals "Pre-selection"
            const cleanRows = rows.filter(row => {
                const statusValue = row['Status'] || '';
                return statusValue.trim().toLowerCase() === 'pre-selection';
            });

            if (cleanRows.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 48px 20px; background-color: #f8fafc; border-radius: 12px; border: 1px dashed #cbd5e1;">
                        <p style="color: #64748b; font-weight: 600; font-size: 16px; margin: 0;">No active pre-selection items found.</p>
                        <p style="color: #94a3b8; font-size: 12px; margin: 5px 0 0 0;">Verify that rows read exactly as "Pre-selection" under the Status column of your sheet.</p>
                    </div>`;
                return;
            }

            cleanRows.forEach((row, index) => {
                // Exact-string bindings matching your pricing masterfile columns
                const id = row['SKU'] || ("N/A-" + index);
                const collectionName = row['Collection Name'] || "Saree Collection";
                const sareeName = row['Saree Name / Number'] || "Unnamed Piece";
                const price = row['Resell Price\n (MUR)'] || row['Resell Price (MUR)'] || "0.00";
                const notes = row['Notes'] || "";
                
                const rawImgUrl = row['Google Drive Share Link (paste here)'];
                const imgUrl = formatDriveImageUrl(rawImgUrl) || "https://unsplash.com";

                globalProducts.push({ id: id, name: collectionName + " - " + sareeName, price: price });

                // Constructs interactive product choice template grids automatically
                const cardHtml = `
                    <label style="display: flex; flex-direction: column; justify-content: space-between; padding: 20px; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; cursor: pointer; box-sizing: border-box; transition: border-color 0.2s;">
                        <div style="display: flex; align-items: start; gap: 12px; margin-bottom: 16px;">
                            <input type="checkbox" value="${id}" style="width: 22px; height: 22px; border-radius: 6px; border: 1px solid #cbd5e1; cursor: pointer; margin-top: 2px; accent-color: #059669;">
                            <div style="flex: 1;">
                                <h3 style="font-size: 16px; font-weight: 700; color: #1e293b; margin: 0; line-height: 1.2;">${collectionName}</h3>
                                <p style="font-size: 13px; color: #64748b; margin: 4px 0 0 0;">${sareeName}</p>
                                <p style="font-size: 10px; font-weight: 600; color: #94a3b8; font-family: monospace; margin: 6px 0 0 0; text-transform: uppercase;">SKU: ${id}</p>
                                <p style="font-size: 16px; font-weight: 800; color: #059669; margin: 6px 0 0 0;">MUR ${price}</p>
                            </div>
                        </div>
                        <div style="width: 100%; height: 220px; background-color: #f8fafc; border: 1px solid #f1f5f9; border-radius: 12px; overflow: hidden; margin-top: auto;">
                            <img src="${imgUrl}" alt="${sareeName}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.src='https://unsplash.com'">
                        </div>
                        ${notes ? `<p style="font-size: 11px; color: #94a3b8; margin: 12px 0 0 0; border-top: 1px solid #f1f5f9; padding-top: 8px; font-style: italic;">${notes}</p>` : ''}
                    </label>
                `;
                container.innerHTML += cardHtml;
            });
        }

        function sendSelection() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
            if (checkboxes.length === 0) {
                alert('Please select at least one saree card by ticking its checkbox before submitting.');
                return;
            }

            let message = "📋 *Saree Collection Selection Report* 📋\n\n";
            checkboxes.forEach(cb => {
                const match = globalProducts.find(p => p.id === cb.value);
                if (match) {
                    message += "✅ *" + match.name + "*\n   ↳ SKU: _" + match.id + "_ | Resell Price: _MUR " + match.price + "_\n\n";
                }
            });

            const targetUrl = "https://wa.me" + encodeURIComponent(message);
            window.open(targetUrl, '_blank');
        }

        function showErrorState(reason) {
            document.getElementById('product-container').innerHTML = `
                <div style="grid-column: 1 / -1; text-align: center; padding: 48px 20px; background-color: #fef2f2; border-radius: 12px; border: 1px dashed #fca5a5;">
                    <p style="color: #dc2626; font-weight: 600; font-size: 16px; margin: 0;">Masterfile Sync Interrupted</p>
                    <p style="color: #ef4444; font-size: 12px; margin: 5px 0 0 0;">Trace Code: ${reason}</p>
                    <p style="color: #64748b; font-size: 12px; margin: 10px 0 0 0;">Ensure that you have chosen 'Comma-separated values (.csv)' inside your spreadsheet's 'Publish to web' settings panel.</p>
                </div>
            `;
        }

        loadSheetDataDirectly();
    </script>
</body>
</html>
