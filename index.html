<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Committee Product Selection</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://tailwindcss.com"></script>
    <!-- PapaParse to handle complex spreadsheet cells flawlessly -->
    <script src="https://cloudflare.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

    <div class="max-w-2xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-100">
        <div class="border-b border-slate-100 pb-4 mb-6">
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Product Selection Portal</h1>
            <p class="text-sm text-slate-500 mt-1">Review the pre-selected collections below and tick your choices to compile your response.</p>
        </div>
        
        <!-- Product Card Grid Layout -->
        <div id="product-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="col-span-full text-center py-12">
                <p class="text-slate-400 font-medium animate-pulse">Synchronizing with Master Sheet...</p>
            </div>
        </div>

        <!-- Submit Panel -->
        <div class="mt-8 pt-4 border-t border-slate-100">
            <button onclick="sendSelection()" class="w-full flex items-center justify-center space-x-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 px-4 rounded-xl shadow-sm transition-all focus:ring-4 focus:ring-emerald-100">
                <span>Send Final Selection via WhatsApp</span>
            </button>
        </div>
    </div>

    <script>
        // Data placeholder
        let globalProducts = [];

        // Alternative loading function bypassing cross-domain browser blocks completely
        function loadSheetViaScript() {
            // Your exact Google Sheet CSV download url built right here:
            const csvUrl = 'https://google.com';
            
            // Use PapaParse's built-in remote downloader which is cross-origin friendly
            Papa.parse(csvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if(results.data && results.data.length > 0) {
                        renderCatalog(results.data);
                    } else {
                        showErrorState();
                    }
                },
                error: function(err) {
                    showErrorState();
                }
            });
        }

        // Extracts unique image keys from Google Drive share links
        function formatDriveImageUrl(rawUrl) {
            if (!rawUrl) return "";
            const cleanUrl = rawUrl.trim();
            
            if (cleanUrl.includes('://google.com')) {
                let fileId = "";
                
                if (cleanUrl.includes('/d/')) {
                    const parts = cleanUrl.split('/d/');
                    if (parts && parts[1]) {
                        fileId = parts[1].split('/')[0].split('?')[0];
                    }
                } else if (cleanUrl.includes('id=')) {
                    const parts = cleanUrl.split('id=');
                    if (parts && parts[1]) {
                        fileId = parts[1].split('&')[0];
                    }
                }
                
                if (fileId) {
                    return `https://googleusercontent.com{fileId}`;
                }
            }
            return cleanUrl;
        }

        function renderCatalog(rows) {
            const container = document.getElementById('product-container');
            container.innerHTML = '';
            globalProducts = [];

            // Case-insensitive check to select Pre-selection items
            const cleanRows = rows.filter(row => {
                const statusValue = row['Status'] || '';
                return statusValue.trim().toLowerCase() === 'pre-selection';
            });

            if (cleanRows.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-slate-400 py-12 bg-slate-50 rounded-xl border border-dashed border-slate-200">No products found marked as "Pre-selection" in your spreadsheet's Status column.</p>`;
                return;
            }

            cleanRows.forEach((row, index) => {
                const id = row['SKU']?.trim() || `N/A-${index}`;
                const name = row['Collection Name']?.trim() || "Unnamed Collection";
                const price = row['Resell Price (MUR)']?.trim() || "0.00";
                
                const rawImgUrl = row['Image URL (auto-generated) or Google Drive Share Link (paste here)'];
                const imgUrl = formatDriveImageUrl(rawImgUrl) || "https://unsplash.com";

                globalProducts.push({ id, name, price });

                const cardHtml = `
                    <label class="group relative flex flex-col justify-between p-4 bg-white border border-slate-200 rounded-2xl cursor-pointer hover:border-emerald-500 hover:shadow-sm transition-all duration-200 select-none">
                        <div class="flex items-start space-x-3 mb-3">
                            <input type="checkbox" value="${id}" class="w-5 h-5 mt-0.5 text-emerald-600 border-slate-300 rounded-lg focus:ring-emerald-500 accent-emerald-600">
                            <div class="flex-1">
                                <h3 class="font-semibold text-slate-800 group-hover:text-emerald-900 transition-colors text-sm leading-tight">${name}</h3>
                                <p class="text-[11px] font-medium text-slate-400 mt-0.5 uppercase tracking-wider font-mono">SKU: ${id}</p>
                                <p class="text-sm font-bold text-emerald-600 mt-1">Rs ${price}</p>
                            </div>
                        </div>
                        <div class="w-full h-40 bg-slate-50 border border-slate-100 rounded-xl overflow-hidden mt-2">
                            <img src="${imgUrl}" alt="${name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.src='https://unsplash.com'">
                        </div>
                    </label>
                `;
                container.innerHTML += cardHtml;
            });
        }

        function sendSelection() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
            if (checkboxes.length === 0) {
                alert('Please check at least one product before submitting your selections.');
                return;
            }

            let message = "📋 *Committee Selection Report* 📋\n\n";
            checkboxes.forEach(cb => {
                const match = globalProducts.find(p => p.id === cb.value);
                if (match) {
                    message += `✅ *${match.name}*\n   ↳ SKU: _${match.id}_ | Price: _Rs ${match.price}_\n\n`;
                }
            });

            const targetUrl = `https://wa.me{encodeURIComponent(message)}`;
            window.open(targetUrl, '_blank');
        }

        function showErrorState() {
            document.getElementById('product-container').innerHTML = `
                <div class="col-span-full text-center py-12 bg-red-50/50 border border-dashed border-red-200 rounded-xl">
                    <p class="text-red-600 font-semibold">Failed to connect to Google Sheet.</p>
                    <p class="text-xs text-slate-400 mt-1">Please ensure your columns are named exactly correctly and the Sheet is Published to Web.</p>
                </div>
            `;
        }

        // Start processing via remote framework script engine
        loadSheetViaScript();
    </script>
</body>
</html>
