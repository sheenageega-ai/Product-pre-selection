<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Committee Product Selection</title>
    <!-- Tailwind CSS for robust mobile grid visuals -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-3 md:p-6 flex flex-col justify-between">

    <div class="max-w-4xl mx-auto w-full bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col flex-grow">
        <div class="pb-3 border-b border-slate-100 mb-4">
            <h1 class="text-xl font-bold text-slate-900 tracking-tight">Product Selection Portal</h1>
            <p class="text-xs text-slate-500 mt-0.5">Review the active Pre-selection collection items directly inside the master data grid below.</p>
        </div>
        
        <!-- Live Embedded Spreadsheet Frame Component -->
        <div class="w-full flex-grow min-h-[450px] bg-slate-50 border border-slate-200 rounded-xl overflow-hidden relative shadow-inner">
            <iframe 
                src="https://google.com" 
                class="absolute inset-0 w-full h-full border-0"
                allowfullscreen>
            </iframe>
        </div>

        <!-- Committee Compilation Interface Hub -->
        <div class="mt-4 pt-4 border-t border-slate-100 space-y-3">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1">Enter Selected Item SKUs or Names:</label>
                <textarea 
                    id="selection-box" 
                    rows="2" 
                    placeholder="Type or paste the chosen SKU numbers here (e.g., SKU-101, SKU-104)..." 
                    class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm bg-slate-50 transition-all placeholder:text-slate-400"></textarea>
            </div>

            <button onclick="sendSelectionViaWhatsApp()" class="w-full flex items-center justify-center space-x-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 px-4 rounded-xl shadow-md transition-all focus:ring-4 focus:ring-emerald-100 text-sm">
                <span>Submit Chosen Items via WhatsApp</span>
            </button>
        </div>
    </div>

    <script>
        function sendSelectionViaWhatsApp() {
            const textInput = document.getElementById('selection-box').value.trim();
            if (!textInput) {
                alert('Please enter at least one selected SKU or item description in the text workspace before compiling.');
                return;
            }

            let message = "📋 *Committee Selection Report* 📋\n\n";
            message += `Selected Items:\n${textInput}\n\n`;
            message += "Submitted via Selection Portal Link.";

            // Execute universal WhatsApp routing link endpoint
            const targetUrl = `https://wa.me{encodeURIComponent(message)}`;
            window.open(targetUrl, '_blank');
        }
    </script>
</body>
</html>
