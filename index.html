<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saree Collection Selection Portal</title>
</head>
<body style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding: 20px; color: #0f172a; margin: 0; min-height: screen; display: flex; flex-direction: column;">

    <div style="max-width: 1100px; margin: 0 auto; width: 100%; background-color: #ffffff; padding: 25px; border-radius: 16px; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05); border: 1px solid #f1f5f9; display: flex; flex-direction: column; min-height: 90vh; box-sizing: border-box;">
        
        <div style="border-bottom: 1px solid #f1f5f9; padding-bottom: 15px; margin-bottom: 20px;">
            <h1 style="font-size: 24px; font-weight: 700; color: #0f172a; margin: 0;">Saree Collection Selection Portal</h1>
            <p style="font-size: 14px; color: #64748b; margin: 5px 0 0 0;">Review the pre-selected pieces in the live grid below, then copy or type the selected SKU numbers at the bottom.</p>
        </div>
        
        <!-- Live Embedded Spreadsheet Visual Component Grid Box -->
        <div style="width: 100%; flex-grow: 1; min-h: 480px; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; position: relative; box-shadow: inset 0 2px 4px 0 rgba(0,0,0,0.02); margin-bottom: 20px;">
            <iframe 
                src="https://google.com" 
                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;"
                allowfullscreen>
            </iframe>
        </div>

        <!-- Committee Selection Compilation Hub -->
        <div style="padding-top: 15px; border-top: 1px solid #e2e8f0;">
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-size: 12px; font-weight: 700; color: #334155; text-transform: uppercase; tracking-letter: 0.05em; margin-bottom: 6px;">Enter Selected Item SKUs or Names:</label>
                <textarea 
                    id="selection-box" 
                    rows="3" 
                    placeholder="Type or paste chosen SKU numbers here (e.g., KS-5621, KS-5625)..." 
                    style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; background-color: #f8fafc; box-sizing: border-box; resize: vertical; font-family: inherit; color: #1e293b; transition: border-color 0.2s;"
                    onfocus="this.style.borderColor='#10b981'; this.style.outline='none';"
                    onblur="this.style.borderColor='#cbd5e1';"></textarea>
            </div>

            <button onclick="sendSelectionViaWhatsApp()" style="width: 100%; display: flex; align-items: center; justify-content: center; background-color: #059669; color: #ffffff; font-weight: 600; padding: 14px 16px; border-radius: 12px; border: none; cursor: pointer; font-size: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); transition: background-color 0.2s;" onmouseenter="this.style.backgroundColor='#047857'" onmouseleave="this.style.backgroundColor='#059669'">
                Submit Chosen Items via WhatsApp
            </button>
        </div>
    </div>

    <script>
        function sendSelectionViaWhatsApp() {
            const textInput = document.getElementById('selection-box').value.trim();
            if (!textInput) {
                alert('Please type or paste at least one chosen SKU or item description before submitting.');
                return;
            }

            let message = "📋 *Saree Collection Selection Report* 📋\n\n";
            message += `Selected Items:\n${textInput}\n\n`;
            message += "Submitted via Selection Portal Link.";

            const targetUrl = "https://wa.me" + encodeURIComponent(message);
            window.open(targetUrl, '_blank');
        }
    </script>
</body>
</html>
